# This is a Databricks asset bundle definition for Test.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Test
  uuid: b33e4483-6430-4788-8c38-1ae2a7772f64

include:
  - resources/jobs/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: "ihsdataproject"
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-ab0e0123-62b1.cloud.databricks.com/
    # variables:
    #   catalog: ihsdataproject
    #   schema: ${workspace.current_user.short_name}

  prod:
    mode: production
    workspace:
      host: https://dbc-ab0e0123-62b1.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/olaniyi.adeoye@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
    # variables:
    #   catalog: ihsdataproject
    #   schema: prod
    permissions:
      - user_name: olaniyi.adeoye@gmail.com
        level: CAN_MANAGE
